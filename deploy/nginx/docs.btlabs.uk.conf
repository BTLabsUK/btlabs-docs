# docs.btlabs.uk: the Epic Cash wallet documentation, a static Docusaurus build under
# /srv/btlabs-docs/current. Installed by deploy/remote-install.sh once the certificate exists;
# docs.btlabs.uk.bootstrap.conf serves the ACME challenge before that.
#
# Written for this host's nginx 1.24 (http2 as a listen flag), with the host's one ACME webroot,
# /var/www/html, from which certbot.timer renews every certificate here.

# HTML revalidates on every view (no-cache); hashed assets are cached hard below.
map $sent_http_content_type $btlabs_docs_expires {
    default        off;
    ~^text/html    epoch;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.btlabs.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.btlabs.uk;

    ssl_certificate     /etc/letsencrypt/live/docs.btlabs.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.btlabs.uk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/btlabs-docs/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 'unsafe-inline' scripts: Docusaurus's inline colour-mode and hydration bootstrap.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'" always;

    expires $btlabs_docs_expires;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
