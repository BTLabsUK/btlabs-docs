# docs.btlabs.uk before its certificate exists: plain HTTP, the ACME challenge from the host's
# webroot, and the site itself so the first certbot run can be checked. remote-install.sh swaps in
# docs.btlabs.uk.conf as soon as the certificate is there.
server {
    listen 80;
    listen [::]:80;
    server_name docs.btlabs.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    root /srv/btlabs-docs/current;
    index index.html;
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;
}
